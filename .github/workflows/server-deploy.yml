name: Deploy (API + admin)

# ops/deploy.sh's own header names "a GitHub Action running these same lines against a
# deploy key" as its upgrade path, so this job does exactly that and nothing else - no
# logic is duplicated in YAML, ops/deploy.sh stays the one place deploy order is encoded.
#
# Push-triggered on server/**, web/** and ops/** (deploy.sh's own dependencies), minus
# ops/tag-host/** (a deliberately separate, uncomplicated, hand-run script for the OTHER
# box per decision-40 - see that directory's own header for why it explicitly does not want
# CI) and ops/workflows/** (unrelated dead code, kept only as a historical artifact). Owner
# instruction, 2026-08-26: ships straight to the production box real workers clock in
# against, same risk profile as the Android/iOS pipelines already auto-shipping to their
# internal test tracks on push. There is still no GitHub environment-approval gate - this
# repo's role (org member, not admin) got a 403 trying to create one - workflow_dispatch
# remains available for a manual run (e.g. to redeploy with no code change, or to test the
# pipeline itself without touching server/web/ops).
#
# Needs 2 repo secrets (Settings -> Secrets and variables -> Actions), both created this
# session:
#   SERVER_DEPLOY_SSH_KEY   CI-only ed25519 keypair. exe.dev's SSH endpoint is its own
#                           account-level gateway, not the box's sshd - a key in the VM's
#                           authorized_keys is not enough on its own (found the hard way:
#                           rsync failed with "protocol version mismatch", which was the
#                           gateway's "Please complete registration" banner corrupting the
#                           wire protocol). The public half is registered the right way, via
#                           `ssh exe.dev ssh-key add` (docs: exe.dev/docs/https-api-local-key),
#                           which is how exe.dev expects a distinct per-workload key: revoke
#                           it any time with `ssh exe.dev ssh-key remove
#                           github-actions-deploy@proximatanfc-timesheets` with zero effect on
#                           any other key. It reaches schimmer-glanz.exe.xyz as exedev, the
#                           same passwordless-sudo account ops/deploy.sh already assumes.
#   WEB_MAPS_KEY            NEXT_PUBLIC_GOOGLE_MAPS_KEY. deploy.sh reads this env var before
#                           falling back to `psst get`, which doesn't exist on a runner.
#
# ops/deploy-known-hosts is schimmer-glanz.exe.xyz's real SSH host key (public, safe to
# commit - captured once via ssh-keyscan) and is pinned here instead of
# StrictHostKeyChecking=no.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "ops/**"
      - "!ops/tag-host/**"
      - "!ops/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # server/check-api.js and server/check-sms-flag.mjs both need a REAL Postgres - and
      # both SKIP (exit 0) when there is none, which on a runner would mean a green deploy
      # that proved nothing. Hence a service container AND the explicit SKIP-is-a-failure
      # grep in the checks step below. 16 matches the box.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: enable corepack
        # web/ and server/ pin different pnpm versions in their own package.json
        # ("packageManager"); corepack resolves per-directory, same as running deploy.sh
        # locally, so no version is hardcoded here.
        run: corepack enable

      - name: pre-install server deps
        # deploy.sh's own step 0 checks (check-fallback-reachable.mjs) import server/lib and
        # server/routes modules before deploy.sh's own step 2 installs them - fine on a dev
        # machine that already has server/node_modules from ordinary local use, not fine on a
        # bare CI checkout. Same command deploy.sh runs at step 2; running it once more there
        # is a no-op.
        run: (cd server && pnpm install --prod --frozen-lockfile)

      - name: server checks
        # THE GATE: check-api.js and check-sms-flag.mjs were runnable-by-hand only, so nothing
        # but a human's memory stopped a red check reaching the box real workers clock in
        # against. Both create and drop their own throwaway schema/database in the service
        # container and never touch production. BEFORE the deploy step, on purpose.
        working-directory: server
        env:
          # check-api.js reads DATABASE_URL; check-sms-flag.mjs shells out to
          # createdb/dropdb/psql/pg_isready with `postgres:///<db>` URLs, which need PG*.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for check in check-api.js check-sms-flag.mjs; do
            echo "=== $check ==="
            node "$check" 2>&1 | tee "/tmp/$check.log"
            # A skip exits 0. On a laptop that is a courtesy; here it is the failure mode
            # this whole step exists to remove.
            if grep -q 'SKIP' "/tmp/$check.log"; then
              echo "$check SKIPPED - it must actually RUN in CI" >&2
              exit 1
            fi
          done

      - name: ssh key + pinned host key
        env:
          SERVER_DEPLOY_SSH_KEY: ${{ secrets.SERVER_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp ops/deploy-known-hosts ~/.ssh/known_hosts

      - name: deploy
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.WEB_MAPS_KEY }}
        run: ./ops/deploy.sh
