name: TestFlight

# Push to master that touches the iOS app -> archive, sign, upload to TestFlight.
#
# Needs 7 repo secrets (Settings -> Secrets and variables -> Actions), all owner-only to
# create - none of this can be generated from a checkout:
#   BUILD_CERTIFICATE_BASE64      Distribution .p12, base64 (see README below)
#   P12_PASSWORD                  password on that .p12
#   BUILD_PROVISION_PROFILE_BASE64  App Store provisioning profile, base64
#   KEYCHAIN_PASSWORD              any throwaway string - only unlocks this run's temp keychain
#   APPSTORE_KEY_ID                App Store Connect API key id
#   APPSTORE_ISSUER_ID             App Store Connect API issuer id
#   APPSTORE_KEY_P8                the key's .p8 contents, base64
#
# CURRENT_PROJECT_VERSION in the checked-out copy gets bumped to the GitHub run number
# before archiving (agvtool) - never committed back. The repo's own CURRENT_PROJECT_VERSION
# stays exactly what the owner set it to by hand (decision-49): this workflow's bump is
# CI-runtime-only, satisfying Apple's "each TestFlight build needs a higher build number"
# rule without writing to project.pbxproj.

on:
  push:
    branches: [main]   # the repo's actual default branch (checked: `git branch --show-current`)
    paths:
      - "NFCTimeSheets/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate + provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"

      - name: Bump build number for this run only (not committed)
        working-directory: NFCTimeSheets
        run: agvtool new-version -all "$GITHUB_RUN_NUMBER"

      - name: Archive
        working-directory: NFCTimeSheets
        run: |
          xcodebuild -project NFCTimeSheets.xcodeproj -scheme NFCTimeSheets \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            archive

      - name: Export IPA
        working-directory: NFCTimeSheets
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo -n "$APPSTORE_KEY_P8" | base64 --decode -o ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Remove temp keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
