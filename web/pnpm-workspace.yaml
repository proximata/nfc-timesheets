# pnpm 11 reads settings from here, not from the "pnpm" field in package.json.
packages:
  - .

# Every dependency that wants to run an install script must be listed explicitly.
# `next` pulls in `sharp` for the image optimizer, which a static export never invokes
# (next.config.mjs sets `images.unoptimized`), so it gets no native build step.
# All false: next ships prebuilt platform binaries for @swc/core, @parcel/watcher is an
# optional dev-server file-watching speedup with a JS fallback, and sharp is only used by
# the image optimizer a static export never invokes (next.config.mjs sets images.unoptimized).
allowBuilds:
  '@parcel/watcher': false
  # decision-70. Its postinstall only fetches the binary used for sourcemap UPLOAD, which
  # this project deliberately does not do (see sentry.*.config.ts — no authToken, same
  # reasoning as Android's plain-SDK-no-gradle-plugin choice: no new required CI secret for
  # a diagnostic-only feature). The SDK's runtime error/log capture needs none of this.
  '@sentry/cli': false
  '@swc/core': false
  sharp: false
