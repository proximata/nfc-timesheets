# THE TAG HOST. Installed at /etc/nginx/conf.d/tag-host.conf on timesheets.exe.xyz.
#
# This box exists to answer three URLs and nothing else, for as long as there are NFC cards
# on walls in Vienna. It has no database, no API, no admin panel, no application code and
# nothing to deploy. That is the entire design (decision-40).
#
# WHY NGINX, AND NOT THIRTY LINES OF NODE
#   1. Needed at all? Yes - Android and iOS will not hand a tap to the app until they have
#      fetched /.well-known/assetlinks.json and the AASA over public HTTPS.
#   2. Already on the box? Yes. nginx ships in the exeuntu image, installed and disabled.
#      Nothing is apt-installed, nothing is compiled, no node_modules, no lockfile.
#   3. So the smallest thing is a config file. There is no code here to rot, no dependency
#      to audit, and security updates arrive with unattended-upgrades like any Ubuntu
#      package. A hand-written server would be ours to maintain for five years to save
#      nothing.
#
# COST TO KEEP ALIVE: one exe.dev VM (1 vCPU / 2 GB - the floor), plus this file. No
# migrations, no restarts on deploy, no secrets, no certificates (the exe.dev proxy
# terminates TLS). Updating it means rsyncing three files and `nginx -s reload`.
#
# WHAT MUST NOT CHANGE, EVER, ON PAIN OF A SITE VISIT PER BUILDING:
#   - the AASA path has NO .json extension, on the filename or the URL. Apple requires
#     exactly /.well-known/apple-app-site-association.
#   - Content-Type is exactly "application/json". Not text/plain, not with a charset.
#   - HTTP 200 with ZERO redirect hops. iOS does not follow a redirect here, and a redirect
#     breaks the Android App Link handoff too.
#   - the same BYTES as server/wellknown/, which is the reviewed artifact.
#
# server/wellknown/verify.sh asserts all four against the live host. It is the gate.

server {
    # 8000 is the exe.dev HTTP proxy's default target port (the proxy forwards 3000-9999
    # only). Changing it here means `ssh exe.dev share port timesheets <n>` too.
    listen 8000 default_server;
    listen [::]:8000 default_server;
    server_name _;

    root /srv/tag;

    server_tokens off;
    autoindex off;

    # nginx answers a directory-shaped request with a 301 to the trailing-slash form, and
    # builds an absolute Location from its own idea of the hostname. Both are redirects,
    # and a redirect on any path below is a dead tag. Off.
    absolute_redirect off;
    port_in_redirect off;

    # ---------------------------------------------------------------------------------
    # `types { }` empties the MIME map for the location, so `default_type` is what gets
    # sent - always, and byte-exact. Relying on the extension is what produces
    # application/octet-stream for the extensionless AASA, which iOS silently ignores.
    # ---------------------------------------------------------------------------------

    location = /.well-known/apple-app-site-association {
        types { }
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files /apple-app-site-association =404;
    }

    location = /.well-known/assetlinks.json {
        types { }
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files /assetlinks.json =404;
    }

    # /t is only ever reached when the app is NOT installed: with the app installed the OS
    # consumes the link and this HTML is never rendered. Both /t and /t/ are SERVED rather
    # than one redirecting to the other, because a redirect breaks the handoff.
    location = /t {
        types { }
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "public, max-age=300" always;
        try_files /t.html =404;
    }

    location = /t/ {
        types { }
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "public, max-age=300" always;
        try_files /t.html =404;
    }

    # Liveness only. Says nothing about whether the files are right - verify.sh does that.
    location = /health {
        types { }
        default_type "text/plain; charset=utf-8";
        return 200 "tag-host ok\n";
    }

    # Everything else. This host serves no admin panel, no API and no directory listing,
    # and a 404 is the honest answer rather than a redirect to somewhere that does.
    location / {
        return 404;
    }
}
