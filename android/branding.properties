# Operator identity for the Android build — the ONE place a signing entity is named.
#
# Everything below is projected into the build by app/build.gradle.kts:
#   ts.applicationId -> applicationId          (IMMUTABLE once uploaded to Play)
#   ts.namespace     -> namespace              (R / BuildConfig package; may differ)
#   ts.appName       -> res string "app_name"
#   ts.tagHost       -> manifest placeholder ${tagHost} AND BuildConfig.TAG_HOST
#   ts.apiHost       -> BuildConfig.API_HOST   (Api.kt base URL; NOT in the manifest)
#   ts.legacyTagHosts-> BuildConfig.LEGACY_TAG_HOSTS (parser only, NOT the manifest)
#   ts.appKey        -> BuildConfig.APP_KEY    (X-App-Key header)
#
# TWO HOSTS, AND THAT IS THE POINT (decision-40). ts.tagHost is written onto physical NFC
# tags and is PERMANENT; ts.apiHost is where the app TALKS and is renameable at will. They
# were one value, the VM got renamed, and a tag already written and promised to a client
# went dead. Changing ts.tagHost here is HALF the job — the other half is ops/branding.json
# + the generated well-known files + web/lib/tag.ts. See android/README.md and
# ops/REBRAND.md § two hosts.
#
# NOT SECRETS. ts.appKey is compiled into the APK; `strings` on any installed build
# recovers it. It is a coarse gate against internet noise, never identity — identity is
# the ts_worker session cookie (decision-22). Real secrets (keystore passwords) live in
# keystore.properties, which is gitignored. See keystore.properties.example.

ts.applicationId=io.github.qwadratic.NFCTimeSheets
ts.namespace=io.github.qwadratic.nfctimesheets
ts.appName=NFC TimeSheets
# THE TAG HOST. Written onto physical NFC tags. PERMANENT — treat it as immutable.
# Serves ONLY the two association files and /t. No API, no database, nothing to rename for.
ts.tagHost=timesheets.exe.xyz

# THE API HOST. Admin panel, REST API, Postgres. Renameable from a keyboard: nothing
# physical points at it, and the app reaches it only through Api.kt. It must NEVER appear
# in an autoVerify intent-filter — that is how a rename kills tag taps.
ts.apiHost=schimmer-glanz.exe.xyz

# Hosts we ONCE wrote onto tags, or once might have. Accepted by the PARSER, nothing more.
#
# A tag holds https://<host>/t?l=<uuid> in ink, on a wall, in a building. Renaming the VM
# from timesheets.exe.xyz to schimmer-glanz.exe.xyz renamed the server in one command and
# left every tag written before the rename carrying a host this app then refused as "not
# one of ours" — TagLink compared against a single host. The tag was fine. The app was the
# thing that broke. decision-40 makes the tag host permanent so it cannot recur; this list
# is what covers the tags written while it was not.
#
# schimmer-glanz.exe.xyz is here because the admin panel printed tag URIs on that host
# between the rename and the split, so a card may exist carrying it. It is not dead — it is
# the live API host — but it is RENAMEABLE, which is exactly why it is a parser entry and
# not a manifest host.
#
# The accepted set is a LIST: current tag host + every host we ever wrote onto a tag.
# Comma-separated. The key must be PRESENT — an empty value is legal and means "no legacy
# hosts", a MISSING key fails the build, because silence is exactly how this was lost.
#
# WHAT THIS BUYS: MANUAL SCAN (in-app Scan screen) on such a tag. The app never fetches the
# tag URL — it parses out the uuid and talks to https://<ts.apiHost> — so the host on the
# tag costs nothing on that path.
#
# WHAT THIS DOES NOT BUY: PASSIVE TAP on such a tag. The OS only hands us an App Link after
# it has fetched https://<that host>/.well-known/assetlinks.json ITSELF and matched it to
# the manifest, and only ts.tagHost is in the manifest.
#
# AND DO NOT "FIX" THAT BY ADDING A LEGACY HOST TO THE MANIFEST. App Link verification is
# ALL-OR-NOTHING across every host in an autoVerify intent-filter: one host that stops
# serving assetlinks.json and the app goes unverified for the LIVE host too — i.e. adding a
# renameable host to get old tags working would break the tags that currently work.
# See android/README.md § legacy hosts.
ts.legacyTagHosts=schimmer-glanz.exe.xyz

