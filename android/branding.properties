# 0.5.5 / 12: THE SMS SIGN-IN SCREEN, AND IT DISAPPEARS CLEANLY WHEN THE SERVER SAYS THE
# DOOR IS OFF (decision-48 §6.6). The owner's own words: "in admin there must be an option
# to choose how to onboard a worker, so if sms didnt work, there is always a fallback" —
# decision-48 answered that by making onboarding a repeatable ACTION, never a stored
# preference, and this is that action's Android half. TimeSheetViewModel reads ONE public
# field at launch, GET /auth/capabilities {sms: boolean} (auth: "app", no session, same
# shape as GET /app/version), and defaults to false on ANY failure — offline, an old
# server, a timeout. SignInScreen composes the new phone + 6-digit-code section ONLY
# inside `if (model.smsAvailable...)`; a build that cannot confirm the flag shows nothing,
# never a disabled or broken control offering a door that would answer 503. Verified on
# THIS build: the live box (schimmer-glanz.exe.xyz) has no TWILIO_* configured at all, so
# every phone running 0.5.5 shows the code field alone, exactly as 0.5.4 did.
#
# THE ENROLMENT-CODE FIELD IS UNTOUCHED. core/EnrolmentCode.kt has zero diff against 0.5.4;
# its own checks (core-check.kt's enrolmentCode(), enrolmentAgainstServer()) pass unmodified.
# The new section is a SEPARATE front door onto the SAME worker_sessions row — a successful
# SMS verify runs the identical adopt/refresh/startMaterials tail signIn() runs, because
# POST /auth/sms/verify mints the byte-identical session POST /auth/code does.
#
# NO RAW ERROR CODE reaches the new screen (decision-8's own rule, every screen in this
# app). Wrong-code and bad-phone-shape get their OWN sentences rather than routing through
# the code field's shared "ask your admin for a new one" text, which would be wrong advice
# for a self-requested SMS code; everything else falls through to the same exhaustive
# mapper every other screen already uses.
#
# 0.5.4 / 11: THE TEST SCAN (decision-47, TASK-242). A zone is no longer a valid clock-in
# target the moment an admin types its name: an operator must hold the physical card to
# this phone once, from a new „Tag prüfen“ screen next to „Tag beschreiben“, before a
# cleaner can tap it. That screen (nfc/VerifyZoneActivity.kt) reads a tag exactly the way
# ScanActivity does and then does something ScanActivity must never do: it posts to
# POST /operator/zones/:id/verify over the OPERATOR session and stops — no ACTION_VIEW, no
# TapInbox, no worker credential anywhere in it, which android/checks/verify-no-shift-check.sh
# now pins against the source and android/checks/release-artefact.sh pins against the
# compiled dex for its DEBUG-only emulator mock (nfc/VerifySimulation.kt, same src/debug
# vs src/release split as the tag writer's own mock).
#
# THE OTHER HALF OF THE SAME DECISION: a shift refused because its zone is not yet proven
# ("zone_unverified") now shows a named German sentence — err_zone_unverified — instead of
# falling through to the generic "rejected" text, and it is RETRYABLE
# (core/ApiFailure.isRetryable): the row stays queued and is sent automatically the moment
# an operator test-scans the card, instead of being stranded the way a 401 once was.
#
# Nothing on the ORDINARY clock-in path changed: an already-verified zone, and the
# grandfathered HOIV building tap, keep working exactly as before.
# 0.5.3 / 10: THE CLOCKED-IN SCREEN STOPS BEING MATERIAL'S PURPLE. 0.5.2 took the wallpaper
# out of the palette and put a hand-written scheme in, but lightColorScheme() assigns only
# what it is handed and everything else falls through to Google's BASELINE. The running
# shift is painted with tertiaryContainer/onTertiaryContainer and its clock card with
# surfaceContainerHighest; none of the three was assigned. Measured on 0.5.2/9, on that
# screen: #FFD8E4 at 47.9% (spread 39), #E6E0E9 at 40.9%, #31111D. 88.8% of the one screen
# the person doing the work looks at all day. Every role is assigned now, in both schemes,
# and checks/core-check.kt 17 fails the build if a screen ever reaches for one that is not.
#
# 0.5.2 / 9: THE APP STOPPED TAKING ITS COLOURS FROM THE WORKER'S WALLPAPER (TASK-238).
# ui/Theme.kt called dynamicLightColorScheme(context) on API 31+, so every worker got a
# different product and the one the director opens in front of a client was whatever was on
# that phone that morning. Half a fix, as 0.5.3 above records.
#
# 0.5.1 / 8: AN EMPTY QUEUE NOW SCHEDULES NOTHING, and Settings stops crying wolf over it.
#
# 0.5.0 armed a background job on EVERY launch and EVERY sign-in, including the ordinary
# case of a phone with nothing outstanding. That contradicts sync/SyncScheduler.kt's own
# contract — "a phone with an empty queue schedules nothing at all and costs no battery" —
# and the cost is not theoretical: a job that wakes on a network and finds nothing to do,
# several times a day, across twenty phones, is the profile EMUI and MIUI move into the
# RESTRICTED bucket, and a restricted app runs NO jobs at all. That would take the delivery
# 0.5.0 exists to provide down with it, silently, on exactly the handsets a cleaning company
# buys. Both sites now ask the queue first; the TAP is the one site that may not, because it
# has just written the row. Nothing about delivery changed: whatever the foreground pass
# cannot send is still armed, on the same predicate the boot receiver already used.
#
# The second half is the screen. Once an idle phone holds no job, the two-state Settings
# line printed „Nicht eingeplant. Wartende Schichten gehen erst hinaus, wenn Sie die App
# öffnen" in the ERROR colour over a phone with no waiting shifts at all — describing rows
# that do not exist, in red, permanently. An alarm that is on whenever nothing is wrong is
# how the real one gets ignored, and the real one here is a handset refusing to schedule.
# There is now a third, uncoloured sentence for the healthy phone, and the platform's
# refusal reason is still shown even after the queue drains, because that is the evidence.
#
# FOUND BY A CHECK, not by reading: demo/prove-offline-push.mjs § 0 takes „no job is pending
# over an empty queue" as the baseline its every later RED is measured against, and it went
# FAIL the second time it was run. core-check now counts the call sites; five mutants show
# it red.
#
# IT ONLY BITES OFFLINE, WHICH IS THE ONLY CASE THIS FEATURE IS FOR. Measured on a device,
# same handset, both builds, force-stopped first so the job state starts at "unknown":
#
#   build      launched ONLINE, empty queue   launched OFFLINE, empty queue   offline TAP
#   0.5.0 / 7  unknown                        WAITING  ← armed for nothing    waiting
#   0.5.1 / 8  unknown                        unknown  ← nothing armed        waiting
#
# Online the defect is invisible: the job is armed, the platform runs it at once because
# its only constraint is already met, it finds an empty queue and finishes. Offline there
# is nothing to run it, so it sits in the queue waiting for a signal that will give it
# nothing to do — and a phone in a basement is where this app is opened.
#
# 0.5.0 / 7: THE OFFLINE TAP NOW REACHES THE SERVER ON ITS OWN (TASK-225). A shift tapped
# with no signal used to sit on the phone until a human opened the app — no server row, no 8h
# net, no payroll line, and no way for anybody to even ASK whether it had happened. There is
# now a JobScheduler job (platform, no new dependency) with a network constraint that survives
# a reboot, and the app SHOWS what it is still holding, in German, with the time of the last
# attempt — on the shift screen, the log screen and the sign-in screen. The office sees it too:
# three X-Pending-* headers ride on requests the app already makes and land on `workers`
# (migration 009), so /payroll/ can say its total is provisional and /workers/ can say whose
# phone. DATABASE MIGRATION 2 -> 3 on the field phone: ALTER TABLE ADD COLUMN, nothing dropped.
# Nothing on the clock-in path changed. See sync/SyncScheduler.kt for the force-stop ceiling.
#
#   TWO DEFECTS THIS BUILD FIXES THAT NO EARLIER BUILD KNEW IT HAD, both found by running
#   demo/prove-offline-push.mjs against a real Android instance rather than by reading source:
#
#   1. THE BACKGROUND PUSH WAS DEAD. AndroidManifest declared INTERNET but not
#      ACCESS_NETWORK_STATE, which JobScheduler requires for a connectivity constraint, so
#      every schedule() threw and a runCatching{} discarded the throw. `cmd jobscheduler
#      get-job-state … 225` answered "unknown" after every offline tap. It now answers
#      "waiting", and the app says on screen when the platform is NOT holding the job rather
#      than promising automatic delivery over a dead scheduler.
#
#   2. OPENING THE APP FROM RECENTS CLOSED THE OPEN SHIFT. Bringing the task back re-delivers
#      the tag intent, and a second read at the same door is a clock-out. Tap in, phone in the
#      pocket, the battery manager kills the process, the worker opens the app to check their
#      hours — shift closed, thirteen seconds after it started, with no button anywhere that
#      could be blamed. THIS AFFECTS 0.4.1 AND EVERY BUILD BEFORE IT: it is not new in 0.5.0,
#      it was only ever found here. A real second tap still closes the shift, checked.
#
# 0.4.1 / 6: THE WRITE SCREEN NO LONGER OVERWRITES A MOUNTED CARD (TASK-220). Presenting a
# card that already carries one of our location ids is refused before any write, and the
# override needs the last six characters of the id being destroyed typed back; writing at
# all now needs an operator session on the phone, not just reporting the card afterwards.
# Nothing on the clock-in path changed. See core/WriteGuard.kt.
#
# 0.4.0 / 5: self-update build — GET /app/version + GET /app/download
# (server/routes/release.js), DownloadManager-driven download, sha256 verify, install via
# PackageInstaller. Otherwise byte-identical to 0.3.0-4. This is the LAST build that has
# to reach the field phone by hand (adb / Telegram) — every build after this one can be
# offered from inside the app itself. See android/README.md § self-update.
# 0.5.8 / 15: TestFlight/Play prep batch — TASK-257/258 (Android NFC-state reuse + in-app
# language switch), TASK-189 (worker's own shift history via GET /shifts/mine),
# TASK-219 (operator reactivate route — server-side, no app change), TASK-260/261/262
# (unresolved-shift warning always names its date, write/verify strings.xml umlaut fix,
# session-clear code path enumerated), TASK-264 (3 distinct paused-download reasons + a
# cancel/retry control reachable from the paused state, not just Fehlgeschlagen),
# TASK-267 (sign-in screen: code+SMS above the fold, rest behind one-tap disclosures),
# TASK-253 (installed version shown in Settings on both platforms). No clock-in path change.
#
# 0.5.9 / 16: TASK-254 (self-update reachable from a fresh install, not only a worker
# session), TASK-268 (notification copy follows the in-app language picker, not the OS
# locale; language picker announces its selection to TalkBack). Cut for a real-device
# verify pass of TASK-268 AC3 — build 15 predates both fixes (868f85a, 10:01) by ~6h
